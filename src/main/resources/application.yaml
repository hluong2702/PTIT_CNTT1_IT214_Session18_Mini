server:
  port: 8081

spring:
  application:
    name: order-service

  # Database H2 In-Memory (Sẵn sàng cho cả MySQL production qua profile)
  datasource:
    url: jdbc:h2:mem:shopmart_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Cấu hình Distributed Cache (Redis)
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # Cấu hình Apache Kafka (Event-driven Saga)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: shopmart-saga-group
      auto-offset-reset: earliest
      auto-startup: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # Cấu hình Spring Cloud Config Server (Mặc định không block khi chạy test đơn lẻ)
  cloud:
    config:
      enabled: false
      uri: http://localhost:8888
      fail-fast: false
    openfeign:
      circuitbreaker:
        enabled: true

# Cấu hình Service Discovery Eureka (Câu 1)
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka

# Cấu hình Resilience4j Circuit Breaker (Câu 2)
# 3 trạng thái: CLOSED -> OPEN -> HALF-OPEN
resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 4
        failureRateThreshold: 50.0
        waitDurationInOpenState: 5000ms
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
