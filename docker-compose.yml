version: '3.8'

services:
  # =========================================================================
  # INFRASTRUCTURE SERVICES
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: shopmart-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - shopmart-net

  mysql:
    image: mysql:8.4
    container_name: shopmart-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopmart_db
    networks:
      - shopmart-net

  # =========================================================================
  # SPRING CLOUD INFRASTRUCTURE (CÂU 1)
  # =========================================================================
  eureka-server:
    image: springcloud/eureka-server:latest
    container_name: shopmart-eureka
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    networks:
      - shopmart-net

  config-server:
    image: springcloud/config-server:latest
    container_name: shopmart-config
    depends_on:
      - eureka-server
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:///config-repo
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    volumes:
      - ./config-repo:/config-repo
    networks:
      - shopmart-net

  api-gateway:
    image: openjdk:21-slim
    container_name: shopmart-gateway
    depends_on:
      - eureka-server
      - config-server
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - shopmart-net

  # =========================================================================
  # BUSINESS MICROSERVICES (CÂU 2, 3, 4)
  # =========================================================================
  order-service:
    image: openjdk:21-slim
    container_name: shopmart-order-service
    depends_on:
      - eureka-server
      - redis
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: order-service
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
    networks:
      - shopmart-net

  inventory-service-1:
    image: openjdk:21-slim
    container_name: shopmart-inventory-1
    depends_on:
      - eureka-server
      - redis
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: inventory-service
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
    networks:
      - shopmart-net

  inventory-service-2:
    image: openjdk:21-slim
    container_name: shopmart-inventory-2
    depends_on:
      - eureka-server
      - redis
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_APPLICATION_NAME: inventory-service
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
    networks:
      - shopmart-net

  payment-service:
    image: openjdk:21-slim
    container_name: shopmart-payment-service
    depends_on:
      - eureka-server
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_APPLICATION_NAME: payment-service
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - shopmart-net

networks:
  shopmart-net:
    driver: bridge
